<!DOCTYPE html>

<title>ERM Daily Brief · Southwire</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#060a12;--s1:#0c1420;--s2:#101c2e;--s3:#14213a;
  --bdr:rgba(28,52,84,0.5);
  --txt:#e2e8f0;--txt2:#94a3b8;--muted:#4a5e78;
  --crit:#ef4444;--crit-dim:rgba(239,68,68,0.12);--crit-bdr:rgba(239,68,68,0.4);--crit-glow:rgba(239,68,68,0.15);--crit-tint:rgba(239,68,68,0.13);
  --high:#f97316;--high-dim:rgba(249,115,22,0.1);--high-bdr:rgba(249,115,22,0.4);--high-glow:rgba(249,115,22,0.12);--high-tint:rgba(249,115,22,0.11);
  --mod:#eab308;--mod-dim:rgba(234,179,8,0.08);--mod-bdr:rgba(234,179,8,0.35);--mod-glow:rgba(234,179,8,0.1);--mod-tint:rgba(234,179,8,0.09);
  --low:#22c55e;--low-dim:rgba(34,197,94,0.06);--low-bdr:rgba(34,197,94,0.3);
  --watch:#06b6d4;--watch-dim:rgba(6,182,212,0.08);--watch-bdr:rgba(6,182,212,0.35);
  --acc:#3b82f6;--opp:#4ade80;--opp-dim:rgba(74,222,128,0.08);--opp-bdr:rgba(74,222,128,0.35);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.5;min-height:100vh;}
a{color:var(--acc);text-decoration:none;}
a:hover{color:#60a5fa;text-decoration:underline;}
button{font-family:inherit;cursor:pointer;}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.6)}50%{box-shadow:0 0 0 5px rgba(239,68,68,0)}}

/* HEADER */
.hdr{background:var(--s1);border-bottom:1px solid var(--bdr);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;}
.hdr-left{display:flex;align-items:center;gap:16px;cursor:pointer;}
.brand{font-size:11px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--acc);}
.hdiv{width:1px;height:20px;background:var(--bdr);}
.hdr-title{font-size:14px;font-weight:500;}
.hdr-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.posture{display:flex;align-items:center;gap:7px;padding:5px 14px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;}
.pdot{width:8px;height:8px;border-radius:50%;animation:pulse-red 1.8s infinite;}
.ts{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}

/* STRIP */
.strip{background:var(--s1);border-bottom:1px solid var(--bdr);padding:10px 28px;display:flex;align-items:center;gap:18px;overflow-x:auto;flex-wrap:wrap;}
.sc{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.sc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sc-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;}
.sc-val{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
.chip{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border-radius:3px;padding:3px 10px;border:1px solid var(--bdr);background:var(--s2);color:var(--txt2);}
.chip:hover{border-color:var(--acc);color:var(--txt);}

/* MAIN */
.main{padding:22px 28px 40px;max-width:1800px;margin:0 auto;display:grid;gap:26px;}

/* SECTION HEADERS */
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.sh-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.sh-line{flex:1;height:1px;background:var(--bdr);}
.sh-count{font-size:10px;color:var(--muted);background:var(--s2);padding:2px 8px;border-radius:3px;white-space:nowrap;}

/* KPI TILES */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px;}
.kpi-tile{border-radius:8px;padding:18px 20px 16px;display:flex;flex-direction:column;min-height:160px;position:relative;}
.kpi-cat{font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.kpi-name{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:2px;}
.kpi-val{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-0.5px;margin:6px 0 2px;}
.kpi-unit{font-size:10px;color:var(--muted);font-weight:500;margin-bottom:6px;}
.kpi-note{font-size:10.5px;color:var(--txt2);line-height:1.45;margin-bottom:10px;flex:1;}
.kpi-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:auto;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;}

/* CARD SHELL */
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:6px;overflow:hidden;}
.card-hdr{font-size:11px;font-weight:600;padding:9px 16px;border-bottom:1px solid var(--bdr);background:var(--s2);display:flex;align-items:center;justify-content:space-between;}
.card-tag{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}

/* SEGMENT CARDS (landing) */
.seg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:16px;align-items:stretch;}
.seg-card{background:var(--s1);border:1px solid var(--bdr);border-radius:6px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;transition:border-color 0.15s,box-shadow 0.15s;}
.seg-card:hover{border-color:rgba(59,130,246,0.5);box-shadow:0 0 20px rgba(59,130,246,0.1);}
.seg-ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.seg-lbl{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;}
.seg-mon{font-size:10.5px;color:var(--muted);line-height:1.45;margin-bottom:10px;}
.seg-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
.seg-ttl{font-size:12px;font-weight:600;line-height:1.35;}
.seg-prev{font-size:11px;color:var(--txt2);line-height:1.5;margin-bottom:12px;flex:1;}
.seg-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid rgba(28,52,84,0.4);}
.seg-cnts{font-size:10px;color:var(--muted);}
.seg-open{font-size:11px;font-weight:700;color:var(--acc);}

/* WIRE */
.wire-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));background:var(--s1);border:1px solid var(--bdr);border-radius:6px;overflow:hidden;}
.wire-item{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(28,52,84,0.35);}
.wire-item:last-child{border-bottom:none;}
.outlet{font-size:9px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--watch);background:var(--watch-dim);border:1px solid var(--watch-bdr);border-radius:3px;padding:2px 6px;white-space:nowrap;flex-shrink:0;margin-top:1px;}
.wire-ttl{font-size:12px;color:var(--txt);line-height:1.4;}

/* SEGMENT NAV */
.seg-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.seg-hdr{background:var(--s1);border:1px solid var(--bdr);border-radius:8px;padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.seg-h1{font-size:22px;font-weight:800;letter-spacing:-0.3px;margin:0 0 6px;}
.seg-meta{font-size:12px;color:var(--txt2);line-height:1.55;max-width:760px;}

/* ITEMS */
.items{display:grid;gap:14px;}
.item{background:var(--s1);border:1px solid var(--bdr);border-left-width:3px;border-radius:6px;padding:18px 22px;}
.item-hdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.item-rank{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.item-ttl{font-size:15px;font-weight:700;line-height:1.35;}
.item-body{margin:0 0 10px;font-size:12.5px;color:var(--txt2);line-height:1.65;max-width:900px;}
.item-srcs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.src-lbl{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.src-a{font-size:11px;font-weight:600;color:var(--acc);background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.3);border-radius:3px;padding:2px 8px;white-space:nowrap;}

/* CHARTS */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px;margin-bottom:16px;}
.chart-tile{background:var(--s1);border:1px solid var(--bdr);border-radius:8px;padding:16px 18px;}
.chart-hdr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.chart-name{font-size:11px;font-weight:600;color:var(--txt2);}
.chart-val{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.5px;margin:4px 0 10px;}
.chart-rng{font-size:9.5px;color:var(--muted);margin-top:6px;}

/* INDUSTRY SPECIFIC */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.erow{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(28,52,84,0.5);gap:16px;}
.erow:last-child{border-bottom:none;}
.erow:hover{background:rgba(59,130,246,0.025);}
.ename{font-size:12px;font-weight:600;margin-bottom:3px;}
.edetail{font-size:11px;color:var(--txt2);line-height:1.45;}
.eright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(28,52,84,0.5);gap:12px;}
.mrow:last-child{border-bottom:none;}
.mlabel{font-size:11px;color:var(--txt2);}
.mval{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.mright2{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.mchg{font-size:10px;font-weight:700;}
.prow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid rgba(28,52,84,0.5);}
.prow:last-child{border-bottom:none;}
.pname{font-size:11px;color:var(--txt2);width:160px;flex-shrink:0;}
.pbar-bg{flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden;}
.pbar{height:100%;border-radius:3px;}
.ppct{font-size:11px;font-weight:700;width:36px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
.port-alert{padding:9px 16px;font-size:10px;font-weight:600;border-top:1px solid var(--bdr);background:rgba(249,115,22,0.05);}
.wgrid5{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:12px;}
.wcard{background:var(--s1);border:1px solid var(--bdr);border-left:3px solid var(--watch);border-radius:6px;padding:14px;}
.wtitle{font-size:12px;font-weight:600;margin-bottom:5px;line-height:1.3;}
.wbody{font-size:11px;color:var(--txt2);line-height:1.5;}
.wmeta{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap;}
.ct{font-size:9px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);background:var(--s3);padding:2px 6px;border-radius:2px;white-space:nowrap;}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:16px;}
.act-card{border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;}
.act-bar{position:absolute;top:0;left:0;right:0;height:3px;}
.act-hz{font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;}
.act-ttl{font-size:15px;font-weight:700;line-height:1.3;}
.act-body{font-size:12px;color:var(--txt2);line-height:1.6;flex:1;}
.act-trig{font-size:10px;color:var(--muted);padding-top:10px;border-top:1px solid var(--bdr);line-height:1.5;}
.act-trig span{color:var(--txt2);font-weight:600;}
.advrow{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(28,52,84,0.5);}
.advrow:last-child{border-bottom:none;}
.advflag{font-size:20px;width:28px;text-align:center;flex-shrink:0;margin-top:2px;}
.advcountry{font-size:12px;font-weight:600;margin-bottom:2px;}
.advdetail{font-size:11px;color:var(--txt2);line-height:1.4;}
.advright{margin-left:auto;flex-shrink:0;}
.acqn{padding:13px 16px;border-bottom:1px solid rgba(28,52,84,0.5);}
.acqn:last-child{border-bottom:none;}
.atitle{font-size:12px;font-weight:600;margin-bottom:5px;}
.abody{font-size:11px;color:var(--txt2);line-height:1.5;max-width:900px;}
.ameta{display:flex;gap:8px;margin-top:8px;align-items:center;}

/* TRAVEL ADVISORY */
.adv-priority{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;margin-bottom:20px;}
.adv-card{border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
.adv-card-top{display:flex;align-items:center;gap:12px;}
.adv-flag{font-size:28px;line-height:1;}
.adv-country-name{font-size:15px;font-weight:800;}
.adv-level-str{font-size:11px;font-weight:600;margin-top:2px;}
.adv-detail{font-size:11.5px;color:var(--txt2);line-height:1.55;flex:1;}
.adv-link{font-size:10px;font-weight:700;color:var(--acc);}
.hr-table{width:100%;border-collapse:collapse;}
.hr-table th{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:7px 14px;border-bottom:1px solid var(--bdr);text-align:left;background:var(--s2);}
.hr-table td{padding:9px 14px;border-bottom:1px solid rgba(28,52,84,0.35);font-size:12px;vertical-align:middle;}
.hr-table tr:last-child td{border-bottom:none;}
.hr-table tr:hover td{background:rgba(59,130,246,0.025);}
.hr-flag{font-size:16px;padding-right:6px;}

/* FOOTER */
.footer{border-top:1px solid var(--bdr);padding:12px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px;}
.ftext{font-size:10px;color:var(--muted);}

/* BUTTONS */
.btn{border:1px solid var(--bdr);background:var(--s2);color:var(--txt2);border-radius:4px;padding:6px 14px;font-size:11px;font-weight:700;}
.btn:hover{border-color:var(--acc);color:var(--txt);}
.hidden-note{font-size:11px;color:var(--muted);margin-top:8px;}

@media(max-width:768px){
  .main{padding:14px;}
  .hdr,.strip,.footer{padding-left:14px;padding-right:14px;}
  .g2{grid-template-columns:1fr;}
}
</style>
</head>

<script>
'use strict';

const D = window.__D || {};
let S = { page:'home', filter:'all' };

// ── Color helpers ─────────────────────────────────────────
const C  = {critical:'#ef4444',high:'#f97316',moderate:'#eab308',low:'#22c55e',watch:'#06b6d4',accent:'#3b82f6',opp:'#4ade80'};
const DM = {critical:'rgba(239,68,68,0.12)',high:'rgba(249,115,22,0.1)',moderate:'rgba(234,179,8,0.08)',low:'rgba(34,197,94,0.06)',watch:'rgba(6,182,212,0.08)',opp:'rgba(74,222,128,0.08)'};
const BD = {critical:'rgba(239,68,68,0.4)',high:'rgba(249,115,22,0.4)',moderate:'rgba(234,179,8,0.35)',low:'rgba(34,197,94,0.3)',watch:'rgba(6,182,212,0.35)',opp:'rgba(74,222,128,0.35)'};
const GL = {critical:'rgba(239,68,68,0.15)',high:'rgba(249,115,22,0.12)',moderate:'rgba(234,179,8,0.1)'};
const TN = {critical:'rgba(239,68,68,0.13)',high:'rgba(249,115,22,0.11)',moderate:'rgba(234,179,8,0.09)'};
const SL = {critical:'Critical',high:'High',moderate:'Moderate',low:'Low'};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function badgeOf(sev, label){
  const k = sev||'low';
  const lbl = label || (k==='opp'?'Opportunity': SL[k]||k);
  return `<span class="badge" style="background:${DM[k]||DM.low};color:${C[k]||C.low};border:1px solid ${BD[k]||BD.low}">${esc(lbl)}</span>`;
}

function tileStyle(sev){
  if(!sev||sev==='low') return 'background:var(--s1);border:1px solid var(--bdr);box-shadow:0 0 12px rgba(0,0,0,0.3)';
  return `background:linear-gradient(145deg,var(--s1) 40%,${TN[sev]} 100%);border:1px solid ${BD[sev]};box-shadow:0 0 24px ${GL[sev]}`;
}

function chgColor(dir){
  if(dir==='bad') return C.critical;
  if(dir==='good') return C.low;
  return C.moderate;
}

function spark(pts){
  if(!pts||pts.length<2) return {line:'',area:''};
  const mn=Math.min(...pts),mx=Math.max(...pts),sp=(mx-mn)||1;
  const step=120/(pts.length-1);
  const xy=pts.map((p,i)=>[+(i*step).toFixed(1),+(33-((p-mn)/sp)*30).toFixed(1)]);
  const line='M'+xy.map(([x,y])=>`${x},${y}`).join(' L');
  return {line, area:line+' L120,36 L0,36 Z'};
}

// ── Render ────────────────────────────────────────────────
function render(){
  const el = document.getElementById('app');
  el.innerHTML = buildApp();
  el.addEventListener('click', onClick);
}

function onClick(ev){
  const nav = ev.target.closest('[data-nav]');
  const flt = ev.target.closest('[data-flt]');
  if(nav){ S.page=nav.dataset.nav; window.scrollTo(0,0); rerender(); }
  else if(flt){ S.filter=flt.dataset.flt; rerender(); }
}

function rerender(){
  const el=document.getElementById('app');
  el.innerHTML=buildApp();
  el.addEventListener('click',onClick);
}

function buildApp(){
  return buildHdr()+buildStrip()+`<div class="main">`+buildMain()+`</div>`+buildFooter();
}

// ── HEADER ─────────────────────────────────────────────────
function buildHdr(){
  const m=D.meta||{};
  const sev=m.postureSev||'high';
  const cur=(D.segments||[]).find(s=>s.id===S.page);
  const title=cur?`ERM Brief · ${cur.label}`:'Southwire Global ERM Daily Brief';
  return `
<div class="hdr">
  <div class="hdr-left" data-nav="home">
    <span class="brand">Southwire ERM</span>
    <div class="hdiv"></div>
    <span class="hdr-title">${esc(title)}</span>
  </div>
  <div class="hdr-right">
    <div class="posture" style="background:${DM[sev]||DM.high};border:1px solid ${BD[sev]||BD.high};color:${C[sev]||C.high};box-shadow:0 0 16px ${GL[sev]||GL.high}">
      <div class="pdot" style="background:${C[sev]||C.high}"></div>
      Threat Posture: ${esc(m.posture||'ELEVATED')}
    </div>
    <span class="ts">${esc(m.date||'')}</span>
    <span class="ts">Run: ${esc(m.runTime||'')}</span>
  </div>
</div>`;
}

// ── SUMMARY STRIP ──────────────────────────────────────────
function buildStrip(){
  const segs=D.segments||[];
  const cnt={critical:0,high:0,moderate:0,low:0};
  segs.forEach(s=>(s.items||[]).forEach(it=>{if(cnt[it.sev]!==undefined)cnt[it.sev]++;}));
  const critSegs=segs.filter(s=>s.level==='critical').length;
  const pills=[
    {label:'Critical',val:cnt.critical,sev:'critical',pulse:true},
    {label:'High',val:cnt.high,sev:'high'},
    {label:'Moderate',val:cnt.moderate,sev:'moderate'},
    {label:'Low',val:cnt.low,sev:'low'},
    {label:'Critical Segments',val:critSegs,sev:'watch'},

  const filters=[['all','All'],['critical','Critical'],['high','High'],['moderate','Mod'],['low','Low']];

      return `<button class="chip" data-flt="${k}" style="${st}">${l}</button>`;

  </div>
</div>`;

  const priority=tv.priority||[];
  const highRisk=tv.highRisk||[];
  const vis=(seg.items||[]).map((it,i)=>({...it,rank:i+1})).filter(it=>S.filter==='all'||it.sev===S.filter);

  return `
${buildSegNav(seg)}
<div class="seg-hdr">
  <div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
      <h1 class="seg-h1">${esc(seg.icon||'')} ${esc(seg.label)}</h1>
      ${badgeOf(seg.level)}
    </div>
    <div class="seg-meta">${esc(seg.monitors)}</div>
  </div>
  <div style="text-align:right;flex-shrink:0">
    <div style="font-size:10px;color:var(--muted)">Source: <a href="${esc(tv.sourceUrl||'')}" target="_blank" rel="noopener" style="color:var(--acc)">${esc(tv.source||'State Dept.')}</a></div>
    <div style="font-size:10px;color:var(--muted);margin-top:3px">Updated: ${esc(tv.updatedAt||'')}</div>
  </div>
</div>

${priority.length?`
<div>
  <div class="sh"><span class="sh-label">Priority Countries</span><div class="sh-line"></div><span class="sh-count">Always monitored</span></div>
  <div class="adv-priority">
    ${priority.map(p=>`
    <div class="adv-card" style="${tileStyle(p.sev)}">
      <div class="adv-card-top">
        <span class="adv-flag">${esc(p.flag)}</span>
        <div>
          <div class="adv-country-name">${esc(p.country)}</div>
          <div class="adv-level-str" style="color:${C[p.sev]||C.moderate}">${esc(p.level)}</div>
        </div>
        <div style="margin-left:auto">${badgeOf(p.sev)}</div>
      </div>
      <div class="adv-detail">${esc(p.detail||'See State Dept. for current advisory details.')}</div>
      <a class="adv-link" href="${esc(p.url||'https://travel.state.gov')}" target="_blank" rel="noopener">View full advisory ↗</a>
    </div>`).join('')}
  </div>
</div>`:''}

${vis.length?`
<div>
  <div class="sh"><span class="sh-label">Intelligence Items</span><div class="sh-line"></div></div>
  <div class="items">${vis.map(it=>buildItem(it)).join('')}</div>
</div>`:''}

${highRisk.length?`
<div>
  <div class="sh"><span class="sh-label">High-Risk Countries Worldwide</span><div class="sh-line"></div><span class="sh-count">Level 3 &amp; 4 · State Dept.</span></div>
  <div class="card">
    <table class="hr-table">
      <thead><tr><th>Country</th><th>Advisory Level</th><th>Risk</th></tr></thead>
      <tbody>
        ${highRisk.map(h=>`
        <tr>
          <td><span class="hr-flag">${h.flag||''}</span>${esc(h.country)}</td>
          <td style="color:${C[h.sev]||C.moderate};font-weight:600">${esc(h.level)}</td>
          <td>${badgeOf(h.sev)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
</div>`:''}

${buildPrevNext(prev,next)}`;
}

// ── FOOTER ─────────────────────────────────────────────────
function buildFooter(){
  const m=D.meta||{};
  return `
<div class="footer">
  <span class="ftext">Southwire ERM · Daily Brief · Confidential · <a href="https://stamoore36-debug.github.io/ERM-Daily-/" style="color:var(--muted)">stamoore36-debug.github.io/ERM-Daily-</a></span>
  <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <span class="ftext">Sources: Anthropic Claude API · Yahoo Finance · FRED · EIA · State Dept. · NWS · CargoNet · Drewry</span>
    <span class="ftext">Generated: ${esc(m.date||'')} · ${esc(m.runTime||'')}</span>
  </div>
</div>`;
}

render();
</script>
</body>
</html>
